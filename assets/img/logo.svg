<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="letterBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="letterRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#f5f5f5"/>

  <!-- Outer red/orange ring: open on the right side, like a C -->
  <path d="M 745 300
           A 320 320 0 1 0 745 724
           A 380 380 0 1 1 745 300 Z"
        fill="url(#redGrad)"/>

  <!-- Inner blue ring: open on the right, offset slightly for double-ring effect -->
  <path d="M 700 350
           A 260 260 0 1 0 700 674
           A 320 320 0 1 1 700 350 Z"
        fill="url(#blueGrad)"/>

  <!-- White gap between rings for separation -->
  <path d="M 745 300 A 320 320 0 1 0 745 724" fill="none" stroke="#f5f5f5" stroke-width="6"/>

  <!-- Letters RC, bold and centered -->
  <text x="512" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="340" letter-spacing="-10">
    <tspan fill="url(#letterBlue)">R</tspan><tspan fill="url(#letterRed)">C</tspan>
  </text>

</svg>
